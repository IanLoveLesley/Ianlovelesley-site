<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi, this is Ian</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
           font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
        }

        /* 暖色调背景：温润信纸与落日渐变 */
        body {
            background: linear-gradient(135deg, #FFF5EC 0%, #FDE0CB 100%);
            color: #5C4D42;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 2rem;
        }

        /* 核心内容容器 */
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }

       /* 开屏大字：深咖啡棕 */
        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: #4A3F35;
            letter-spacing: -0.03em;
        }

        /* 个人简介文字：柔和的暖灰棕色 */
        .bio-text {
            font-size: 1.15rem;
            color: #7A6B5D;
            line-height: 1.8;
            margin-bottom: 3.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 标识（图标）网格布局 */
        .icon-grid {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        /* 单个标识卡片样式：半透明奶油白底色 */
        .icon-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #7A6B5D;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            width: 110px;
            box-shadow: 0 4px 15px rgba(226, 135, 67, 0.05); /* 极淡的暖色阴影 */
        }

        /* 标识内的 SVG 图标大小 */
        .icon-card svg {
            width: 32px;
            height: 32px;
            margin-bottom: 0.8rem;
            stroke: #7A6B5D;
            transition: stroke 0.4s ease, transform 0.4s ease;
        }

        /* 标识的名字文字 */
        .icon-label {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        /* 鼠标悬停（Hover）动效：焦糖橘/晚霞色 */
        .icon-card:hover {
            color: #D36B46;
            background: rgba(255, 255, 255, 0.95);
            border-color: #F8B49C;
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(211, 107, 70, 0.15);
        }

        .icon-card:hover svg {
            stroke: #D36B46;
            transform: scale(1.1);
        }

        /* 入场淡入动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .hero-title { font-size: 2.5rem; }
            .icon-grid { gap: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 开屏大字 -->
        <h1 class="hero-title">Hi, this is Ian</h1>
        
        <!-- 2. 个人简介 (暗门就藏在这段文字上) -->
        <p class="bio-text" id="secret-us-door" style="cursor: default; user-select: none;">
            欢迎来到我的数字自留地。这里记录着一行行严谨的逻辑代码，<br>
            也存放着一些关乎生活、文字与思维的温柔瞬间。
        </p>

        <!-- 3. 功能标识网格 -->
        <div class="icon-grid">
            
            <!-- 标识 1：我的作品 -->
            <a href="works.html" class="icon-card">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 9.75L16.5 12l-2.25 2.25m-4.5 0L7.5 12l2.25-2.25M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" />
                </svg>
                <span class="icon-label">WORKS</span>
            </a>

            <!-- 标识 2：我的小作文 -->
            <a href="essays.html" class="icon-card">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                </svg>
                <span class="icon-label">ESSAYS</span>
            </a>

           <!-- 标识 3：关于我 -->
            <a href="about.html" class="icon-card">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                </svg>
                <span class="icon-label">ABOUT</span>
            </a>

            <!-- 标识 4：联系我 -->
            <a href="contact.html" class="icon-card">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                </svg>
                <span class="icon-label">CONTACT</span>
            </a>

            <!-- 标识 5：留言板 -->
            <a href="guestbook.html" class="icon-card">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
                </svg>
                <span class="icon-label">GUESTBOOK</span>
            </a>
        </div>
    </div>

    <!-- 秘密基地的暗门逻辑 -->
    <script>
        document.getElementById('secret-us-door').addEventListener('dblclick', function() {
            let pwd = prompt("这里是秘密基地。请输入专属密钥：");
            
            if (pwd === "921727") {
                window.location.href = 'us.html';
            } else if (pwd !== null) {
                // 如果密码输入错误，且没有点击取消
                alert("密钥错误，这不是为你准备的门。");
            }
        });
    </script>
</body>
</html>
