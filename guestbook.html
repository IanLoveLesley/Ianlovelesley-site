<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook - Ian</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #FFF5EC 0%, #FDE0CB 100%);
            color: #5C4D42;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 2rem;
        }

        .container {
            max-width: 700px;
            width: 100%;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 页面标题 */
        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #4A3F35;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            font-size: 1.1rem;
            color: #7A6B5D;
            text-align: center;
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        /* 留言输入区（信纸质感） */
        .message-form {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 3rem;
            box-shadow: 0 4px 20px rgba(226, 135, 67, 0.08);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            gap: 1rem;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #F8B49C;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.5);
            color: #5C4D42;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus {
            background: #ffffff;
            border-color: #D36B46;
            box-shadow: 0 0 0 3px rgba(211, 107, 70, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            align-self: flex-end;
            background: #D36B46;
            color: #ffffff;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #C05A35;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(211, 107, 70, 0.3);
        }

        /* 留言展示区 */
        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message-card {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
        }

        .vip-card {
            background: rgba(255, 255, 255, 0.85);
            border-color: #F8B49C;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }

        .msg-author {
            font-weight: 700;
            color: #4A3F35;
        }
        
        .vip-author {
            color: #D36B46;
        }

        .msg-date {
            color: #9CA3AF;
        }

        .msg-content {
            color: #6B7280;
            line-height: 1.6;
        }

        /* 返回主页按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            margin-top: 3rem;
            text-decoration: none;
            color: #7A6B5D;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #D36B46;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="page-title">时光信箱</h1>
        <p class="page-subtitle">无论是灵光一现的想法，还是想对我说的话，<br>都欢迎投递在这个小小的树洞里。</p>

        <div class="giscus-container" style="width: 100%; background: rgba(255, 255, 255, 0.6); border-radius: 16px; padding: 2rem; box-shadow: 0 4px 20px rgba(226, 135, 67, 0.08);"></div>

        data-theme="noborder_light"

        crossorigin="anonymous"

        <!-- 返回按钮 -->
        <a href="index.html" class="back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">

            返回主页

</body>
</html>
