<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ian</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #FFF5EC 0%, #FDE0CB 100%);
            color: #5C4D42;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 2rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 页面标题 */
        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #4A3F35;
            margin-bottom: 1rem;
            text-align: center;
        }

        .page-subtitle {
            font-size: 1.1rem;
            color: #7A6B5D;
            text-align: center;
            margin-bottom: 3rem;
        }

        /* 联系方式列表 */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* 单个联系卡片 */
        .contact-item {
            display: flex;
            align-items: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            text-decoration: none;
            color: #5C4D42;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(226, 135, 67, 0.05);
        }

        .contact-item:hover {
            transform: translateX(10px);
            background: rgba(255, 255, 255, 0.95);
            border-color: #F8B49C;
            box-shadow: 0 8px 25px rgba(211, 107, 70, 0.15);
        }

        .contact-icon {
            width: 40px;
            height: 40px;
            margin-right: 1.5rem;
            fill: currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contact-icon svg {
            width: 28px;
            height: 28px;
            stroke: #D36B46;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
        }

        .contact-platform {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .contact-detail {
            font-size: 0.95rem;
            color: #7A6B5D;
        }

        /* 返回主页按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            margin-top: 3rem;
            text-decoration: none;
            color: #7A6B5D;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #D36B46;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="page-title">Contact Me</h1>
        <p class="page-subtitle">如果你有任何想法，或者想探讨交流，欢迎联系我。</p>

        <div class="contact-list">
            <!-- Email -->
            <a href="mailto:Ianlovelesley@outlook.com" class="contact-item">
                <div class="contact-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                    </svg>
                </div>
                <div class="contact-info">
                    <span class="contact-platform">Email</span>
                    <span class="contact-detail">Ianlovelesley@outlook.com</span>
                </div>
            </a>

            <!-- GitHub -->
            <a href="https://github.com/IanLoveLesley" target="_blank" class="contact-item">
                <div class="contact-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5" />
                    </svg>
                </div>
                <div class="contact-info">
                    <span class="contact-platform">GitHub</span>
                    <span class="contact-detail">IanLoveLesley</span>
                </div>
            </a>

            <!-- QQ -->
            <div class="contact-item" style="cursor: default;">
                <div class="contact-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 9.75a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375m-13.5 3.01c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.184-4.183a1.14 1.14 0 01.778-.332 48.294 48.294 0 005.83-.498c1.585-.233 2.708-1.626 2.708-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
                    </svg>
                </div>
                <div class="contact-info">
                    <span class="contact-platform">QQ</span>
                    <span class="contact-detail">1650788357</span>
                </div>
            </div>

        </div>

        <!-- 返回按钮 -->
        <a href="index.html" class="back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
            返回主页
        </a>
    </div>

</body>
</html>
